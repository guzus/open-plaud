name: OpenPlaud
options:
  minimumXcodeGenVersion: "2.45.4"
  deploymentTarget:
    iOS: "17.0"
  localPackagesGroup: ""
packages:
  OpenPlaudMobileTranscription:
    path: .
    group: ""
targets:
  OpenPlaudApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/OpenPlaud
      - path: App/OpenPlaud
    dependencies:
      - package: OpenPlaudMobileTranscription
        product: OpenPlaudCompanion
      - package: OpenPlaudMobileTranscription
        product: OpenPlaudMobileTranscription
    info:
      path: App/OpenPlaud/Info.plist
      properties:
        CFBundleDisplayName: Open Plaud
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: Open Plaud uses Bluetooth to discover and configure nearby Open Plaud devices.
        NSMicrophoneUsageDescription: Open Plaud uses microphone access only when recording or transcribing audio you choose.
        NSSpeechRecognitionUsageDescription: Open Plaud uses on-device speech recognition to transcribe recordings.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: GGYW4A4D65
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.guzus.openplaud
        PRODUCT_NAME: OpenPlaud
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      gatherCoverageData: false
