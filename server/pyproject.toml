[project]
name = "open-plaud"
version = "0.0.1"
description = "Open-source, self-hostable alternative to AI voice recorders — pluggable transcribe → summarize pipeline."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "open-plaud contributors" }]

# Runtime stack for the documented pipeline:
#   - fastapi/uvicorn: the device upload API (POST /v1/recordings) + dev server
#   - pydantic(-settings): typed models + config/secrets from .env
#   - httpx: async calls to cloud transcription/summarization providers
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
]

# Dev tooling. PEP 735 group — `uv sync` installs it by default.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_plaud"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# orchestrator + providers are async; let pytest-asyncio pick up `async def test_*`
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
